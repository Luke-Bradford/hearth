name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes hearth tests hearth.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
