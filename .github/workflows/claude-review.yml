name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main]

jobs:
  review:
    # a fork's PR gets no secrets (pull_request, not _target): only review branches of this repo
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: gh pr diff ${{ github.event.pull_request.number }} > pr.diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR description
        run: |
          gh pr view ${{ github.event.pull_request.number }} \
            --json title,body \
            -q '"# " + .title + "\n\n" + .body' > pr_desc.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR comments
        # only the review bot's own reviews and the repository owner's replies: the prompt counts
        # earlier reviews and honours "tracked in an issue", so nobody else's comment may steer it
        # every page (a long review thread passes the API's 30-a-page default); the owner's name
        # reaches jq as a variable, never spliced into the script
        # pipefail: a failed fetch must fail the step, not pass on an empty history
        run: |
          set -o pipefail
          gh api --paginate repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            | jq -s -r --arg owner "$OWNER" '[add // [] | .[] | select(.user.login == "github-actions[bot]" or .user.login == $owner)
                  | "### Comment by " + .user.login + " at " + .created_at + "\n" + .body] | join("\n\n---\n\n")' \
            > pr_comments.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}

      - name: Build request body
        run: |
          cat > build_prompt.py << 'PYEOF'
          import json

          diff = open('pr.diff').read()
          desc = open('pr_desc.txt').read()
          comments_raw = open('pr_comments.txt').read().strip()

          prompt = (
              "You are a strict senior code reviewer for Hearth, a Python (standard library only) home network "
              "monitor that runs on a home server, pings LAN devices and the internet, stores data in SQLite, "
              "and serves a dashboard plus JSON API on the home LAN. "
              "Your job is to find real problems, not to be encouraging.\n\n"
              "## Important constraints\n\n"
              "You only see the diff, not the full codebase. The PR description is written to give you the "
              "context you need about surrounding code. Trust it. If the PR description explains why something "
              "outside the diff makes a change safe, accept that explanation.\n\n"
              "This may not be a first review. Read the PR comment history carefully. Do NOT re-raise issues "
              "already addressed or explained in the thread. Only flag issues genuinely unresolved in the "
              "current diff. A removal may be the fix, not the problem.\n\n"
              "## PR Description\n\n" + desc + "\n\n"
              "## PR Comment History (previous review rounds and author responses)\n\n"
              + (comments_raw if comments_raw else "(no comments yet)") + "\n\n"
              "## What to check\n"
              "1. **Correctness**: does the logic do what the description claims? Off-by-one, wrong units, "
              "threading/races, unhandled exceptions that would kill a background thread.\n"
              "2. **Security**: unvalidated input reaching SQL or HTML, injection, path traversal, anything that "
              "lets a LAN user write or execute beyond what the stated security model allows, secrets in code.\n"
              "3. **Resource use**: unbounded growth (memory, DB, threads, subprocesses), work repeated on every "
              "request, orphaned processes.\n"
              "4. **Robustness on other homes**: hard-coded assumptions about one network, Windows-only code "
              "reached on Linux without a guard.\n"
              "5. **Scope creep**: does this do more than the description says?\n"
              "6. **Regressions**: anything removed that other code still depends on.\n\n"
              "## What NOT to flag\n"
              "- Code in unchanged files\n"
              "- Concerns already resolved in the comment history, including ones the author says are "
              "tracked in an issue\n"
              "- The dashboard having no login (documented, LAN-only by design)\n"
              "- Use of the standard library instead of third-party packages (deliberate)\n\n"
              "## Severity: be strict about what is a WARNING\n"
              "- **BLOCKING**: a concrete failure in realistic use - wrong result, crash, data loss, a "
              "security hole, a dead background thread.\n"
              "- **WARNING**: only if you can state a concrete failure scenario in one sentence: 'given "
              "<input or state>, <this code> does <wrong thing>'. If you can't name the input and the wrong "
              "outcome, it is not a WARNING.\n"
              "- **NITPICK**: everything else - wording, naming, style, test tidiness, 'consider', "
              "'could be clearer', unlikely hypotheticals, small inefficiencies with no real impact.\n"
              "- **Design documents** (a diff of only docs): flag only statements that are wrong or that "
              "contradict each other. Requests for more detail or precision are NITPICKs - they are "
              "settled in the implementation PRs.\n"
              "- **Later rounds**: count the earlier 'Claude Code Review' comments in the history. From "
              "the third review on, report only BLOCKING issues and concrete-failure WARNINGs in code this "
              "PR changed since the last review; leave out NITPICKs entirely.\n\n"
              "**Format your response as:**\n\n"
              "Only include a section if it has at least one item; omit empty sections entirely. If an issue "
              "turns out to be already fixed, mention it only in the Verdict. If there is nothing to "
              "report, write 'Nothing further.' before the Verdict.\n\n"
              "### [BLOCKING] - must fix before merge\n"
              "Each issue with file:line reference and the concrete failure.\n\n"
              "### [WARNING] - should fix, not blocking\n"
              "Each issue with file:line reference and its failure scenario (input -> wrong outcome).\n\n"
              "### [NITPICK] - optional / style\n"
              "Each issue with file:line reference.\n\n"
              "### Verdict\n"
              "One of: **APPROVE**, **REQUEST CHANGES**, or **NEEDS DISCUSSION**. APPROVE whenever there "
              "is no BLOCKING issue; NEEDS DISCUSSION only for a genuine design question the author must "
              "answer, never for wording. If approving, briefly note previously-raised issues now "
              "confirmed fixed.\n\n"
              "Be direct. If the code is fine, say so. Do not pad the review with praise.\n\n"
              "## Diff\n```diff\n" + diff + "\n```"
          )

          with open('prompt.txt', 'w') as f:
              f.write(prompt)
          print(f"Prompt written: {len(diff)} chars of diff, {len(prompt)} chars total")
          PYEOF
          python3 build_prompt.py

      - name: Call Claude API
        run: |
          python3 -m pip install --quiet anthropic
          cat > call_claude.py << 'PYEOF'
          import sys
          import anthropic

          client = anthropic.Anthropic()  # reads ANTHROPIC_API_KEY
          prompt = open('prompt.txt').read()
          # Sonnet 5.5 always thinks, and thinking counts against max_tokens, so a large diff
          # needs a large limit; that in turn needs streaming to avoid HTTP timeouts.
          with client.messages.stream(
              model="claude-sonnet-5-5",
              max_tokens=64000,
              output_config={"effort": "medium"},
              messages=[{"role": "user", "content": prompt}],
          ) as stream:
              msg = stream.get_final_message()

          print(f"stop_reason={msg.stop_reason} usage={msg.usage}")
          if msg.stop_reason == "refusal":
              print("Review declined by safety classifier:", msg.stop_details)
              sys.exit(1)
          if msg.stop_reason == "max_tokens":
              print("Review hit max_tokens before finishing; lower effort or split the PR.")
              sys.exit(1)
          # the reply holds thinking blocks first; keep only the text
          text = "".join(b.text for b in msg.content if b.type == "text")
          if not text.strip():
              print("No review text in the response")
              sys.exit(1)
          open('review.txt', 'w').write(text)
          PYEOF
          python3 call_claude.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post review comment
        run: |
          # --body-file: the review text never passes through the shell (no $( ) or backtick expansion)
          { printf '## Claude Code Review\n\n'; cat review.txt; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
